<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>KONNBOT Project Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- non-blocking: a slow or blocked font request must never hold up the app script -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"></noscript>
<style>
:root{
  --ink:#161B26;--dark:#1E2534;--darkLine:#2A3346;--accent:#FFC000;--accentInk:#1A1200;--gold:#946A00;
  --chip:#FFF6D6;--chipInk:#5C4200;--border:#E5E7EC;--soft:#F4F5F8;--muted:#8C93A3;--text2:#5A6172;--body:#2E3444;
  --white:#fff;--scrim:rgba(14,18,27,.45);--night:#0E121B;--W:520px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#E9EBF0;font-size:14px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit}
img{display:block}
.app{max-width:var(--W);margin:0 auto;min-height:100vh;background:var(--white);position:relative;box-shadow:0 0 40px rgba(22,27,38,.12)}
.layer{position:fixed;top:0;bottom:0;left:max(0px,calc(50vw - var(--W)/2));width:min(100vw,var(--W))}
.hide{display:none!important}
.ico{display:block;flex:none}
.noscroll{overflow:hidden}

/* splash */
#splash{z-index:100;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease}
#splash.out{opacity:0}
#splash img{width:260px;height:auto;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
#splash.out img{transform:scale(1.15);transition:transform .45s ease-in}
#splash .track{position:absolute;bottom:64px;left:50%;margin-left:-60px;width:120px;height:3px;border-radius:2px;background:#EEF0F3;overflow:hidden}
#splash .bar{height:100%;background:var(--accent);transform-origin:left;animation:fill 1.1s cubic-bezier(.45,0,.55,1) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* brand */
.brand{height:36px;width:auto}
.brand-dark{background:#fff;border-radius:8px;padding:5px}
.brand-dark img{height:24px;width:auto}

/* home header */
.hdr{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border)}
.topRow{height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.present{height:36px;padding:0 14px 0 11px;border-radius:999px;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.searchRow{display:flex;gap:8px;padding:0 16px 10px}
.search{flex:1;min-width:0;height:46px;border-radius:12px;background:var(--soft);padding:0 12px;display:flex;align-items:center;gap:10px}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search .x{width:22px;height:22px;border-radius:50%;background:#D5D8E0;display:flex;align-items:center;justify-content:center}
.filterBtn{height:46px;padding:0 14px;border-radius:12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;background:var(--soft)}
.filterBtn.on{background:var(--dark);color:#fff}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accentInk);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.pills{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;white-space:nowrap;max-width:200px}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill.on{background:var(--chip);border-color:var(--accent);color:var(--chipInk);font-weight:600}
.pill .ico{transition:transform .15s}
.pill.open .ico{transform:rotate(180deg)}

/* home body */
.pad{padding:0 16px}
.titleRow{display:flex;align-items:flex-end;gap:12px;margin-top:16px}
h1.h1{font-size:24px;line-height:29px;font-weight:700;margin:0}
.summary{font-size:12.5px;color:var(--text2);margin-top:2px}
.toggle{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--soft)}
.toggle button{width:36px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.toggle button.on{background:#fff}
.strip{background:var(--dark);border-radius:16px;display:flex;padding:12px 2px}
.strip .cell{flex:1;min-width:0;padding:0 10px;border-left:1px solid var(--darkLine)}
.strip .cell:first-child{border-left-color:transparent}
.strip .v{font-weight:600;font-size:18px;line-height:22px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .l{font-weight:600;font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listHead{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.count{font-weight:600;font-size:15px}
.sort{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px}
.menu{position:fixed;z-index:60;min-width:180px;background:#fff;border-radius:12px;border:1px solid var(--border);padding:4px 0;box-shadow:0 6px 24px rgba(22,27,38,.22)}
.menu button{display:block;width:100%;padding:10px 14px;font-weight:500;font-size:13px}
.menu button.on{font-weight:600;color:var(--gold)}
.eyebrow{font-weight:600;font-size:10.5px;letter-spacing:.84px;text-transform:uppercase;color:var(--gold)}
.eyebrow.sm{font-size:10px;letter-spacing:.8px}

.card{display:block;width:100%;margin-bottom:22px}
.card .hero{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--soft)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stat-pill{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(255,255,255,.95);font-weight:600;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.ph-pill{position:absolute;right:10px;bottom:10px;padding:3px 9px;border-radius:999px;background:rgba(22,27,38,.72);color:#fff;font-weight:600;font-size:11px}
.card .meta{display:grid;gap:3px;margin-top:10px}
.card .name{font-weight:600;font-size:16px;line-height:21px}
.loc{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text2)}
.specs{display:flex;border:1px solid var(--border);border-radius:12px;margin-top:10px}
.specs>div{flex:1;min-width:0;padding:8px 10px;border-left:1px solid var(--border)}
.specs>div:first-child{border-left:0}
.specs .sv{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.specs .sl{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.gcard{display:block;width:100%;margin-bottom:18px;text-align:left}
.gcard .hero{aspect-ratio:4/3;border-radius:12px}
.gcard .gdot{position:absolute;left:8px;top:8px;width:13px;height:13px;border-radius:50%;border:2px solid #fff}
.gcard .eyebrow{margin-top:6px}
.gname{font-weight:600;font-size:13.5px;line-height:18px;margin-top:6px}
.gmini{font-size:11.5px;color:var(--text2);margin-top:2px}
.empty{text-align:center;padding:48px 28px}
.empty h3{margin:0;font-weight:600;font-size:15px}
.empty p{margin:4px 0 0;font-size:13px;color:var(--text2)}
.empty button{margin-top:16px;height:44px;padding:0 20px;border-radius:12px;background:var(--dark);color:#fff;font-weight:600;font-size:13.5px}
.footer{margin:32px 16px 0;border-top:1px solid var(--border);padding:14px 0 40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}

/* dropdown panel + sheet */
.scrim{position:fixed;inset:0;background:transparent;z-index:50}
.panel{position:fixed;z-index:51;background:#fff;border-radius:16px;border:1px solid var(--border);padding:14px;box-shadow:0 8px 28px rgba(22,27,38,.25);display:flex;flex-direction:column;left:max(16px,calc(50vw - var(--W)/2 + 16px));width:min(calc(100vw - 32px),calc(var(--W) - 32px))}
.panel h4{margin:0 0 10px;font-weight:600;font-size:14px}
.panel .scroll{overflow:auto;min-height:0}
.foot{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13.5px;background:var(--soft)}
.btn.dk{flex:1.8;background:var(--dark);color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{width:calc(50% - 4px);flex-grow:1;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px}
.opt .ol{flex-shrink:1;min-width:0;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .oc{font-weight:600;font-size:11px;color:var(--muted)}
.opt.on{background:var(--dark);border-color:var(--dark);color:#fff}
.opt.on .oc{color:var(--accent)}
.opt.zero{opacity:.4}
.sheetWrap{z-index:70;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:#fff;border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;animation:up .25s ease both;padding-bottom:max(env(safe-area-inset-bottom),14px)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid var(--border)}
.sheet .title{font-weight:600;font-size:17px}
.sheet .sub{font-size:12px;color:var(--muted)}
.round{width:40px;height:40px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.sheet .body{overflow:auto;padding:0 16px}
.sec{border-bottom:1px solid var(--border)}
.secBtn{width:100%;min-height:58px;display:flex;align-items:center;gap:12px}
.secBtn .lb{font-weight:600;font-size:14px}
.secBtn .sm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secBtn .sm.on{color:var(--gold)}
.secBtn .ico{transition:transform .15s}
.sec.open .secBtn .ico{transform:rotate(180deg)}
.sec .secBody{padding-bottom:16px}
.sheet .foot{padding:12px 16px 0;margin:0;border-top:1px solid var(--border)}
.sheet .btn{height:48px}

/* detail */
.dbar{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#fff;border-bottom:1px solid var(--border)}
.dbar .pos{flex:1;text-align:center;font-weight:500;font-size:12px;color:var(--muted)}
.heroC{position:relative}
.heroS{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.heroS::-webkit-scrollbar{display:none}
.heroS button{flex:none;width:100%;aspect-ratio:4/3;scroll-snap-align:start;position:relative;background:var(--soft)}
.hpill{position:absolute;bottom:12px;font-weight:600;font-size:10.5px;letter-spacing:.8px;color:#fff;background:rgba(22,27,38,.72);padding:4px 10px;border-radius:999px;pointer-events:none}
.harrow{position:absolute;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;background:rgba(14,18,27,.5);display:flex;align-items:center;justify-content:center}
.dbody{padding:16px 16px 0;display:grid;gap:14px}
.dbody h1{margin:0;font-size:22px;line-height:27px;font-weight:700}
.progress{border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ptop .st{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.ptop .dot{width:8px;height:8px}
.ptop .sd{font-size:12px;color:var(--text2)}
.stages{display:flex;gap:4px;margin-top:10px}
.stages>div{flex:1}
.stages .seg{height:5px;border-radius:3px}
.stages .sl{font-size:10.5px;margin-top:5px;font-weight:500;color:var(--muted)}
.stages .sl.on{color:var(--ink);font-weight:600}
.tabbar{display:flex;height:44px;border-bottom:1px solid var(--border);margin-top:14px;position:sticky;top:56px;z-index:15;background:#fff}
.tabbar button{flex:1;text-align:center;font-weight:500;font-size:13px;color:var(--muted);position:relative}
.tabbar button.on{font-weight:600;color:var(--ink)}
.tabbar button.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.page{padding:12px 16px 16px}
.stack{display:grid;gap:20px}
.desc{font-size:14px;line-height:22px;color:var(--body);margin:0}
.secLabel{font-weight:600;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.mix{display:flex;flex-wrap:wrap;gap:8px}
.mix>div{height:38px;padding:0 12px;border-radius:10px;background:var(--soft);display:flex;align-items:center;gap:8px}
.mix i{width:8px;height:8px;border-radius:2px;display:block}
.mix b{font-weight:600;font-size:14px}
.mix span{font-size:12.5px;color:var(--text2)}
.link{margin-top:10px;min-height:32px;display:flex;align-items:center;gap:4px;font-weight:600;font-size:13px;color:var(--gold)}
.facts{display:flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.fact{width:50%;padding:10px 12px;border:.5px solid var(--border)}
.fact .fl{font-weight:600;font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--gold)}
.fact .fv{font-weight:600;font-size:14.5px;margin-top:1px}
.fact .fs{font-size:11px;color:var(--muted)}
.fine{font-size:11.5px;color:var(--muted);margin:0}
.box{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.specRow{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--border)}
.specRow:first-child{border-top:0}
.specRow .sk{width:110px;flex:none;font-weight:600;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);padding-top:2px}
.specRow .sv2{flex:1;font-size:13.5px;line-height:19px}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.photo{width:calc(50% - 5px);flex-grow:1;display:grid;gap:5px;align-content:start}
.photo .pi{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--soft);position:relative}
.photo .pc{font-weight:500;font-size:12px}
.photo .pc b{font-weight:600;color:var(--gold);margin-right:8px}
.floorList{display:grid;gap:6px}
.floor{min-height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;gap:12px;width:100%}
.floor .tag{width:30px;height:30px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--text2);flex:none}
.floor .fm{flex:1;min-width:0}
.floor .fn{font-weight:600;font-size:13.5px}
.floor .fsub{font-size:11.5px;opacity:.75}
.floor .fa{font-weight:600;font-size:12.5px}
.floor.on{background:var(--dark);border-color:var(--dark);color:#fff}
.floor.on .tag{background:var(--accent);color:var(--accentInk)}
.fhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.fhead b{font-weight:600;font-size:17px}
.fhead span{font-size:12px;color:var(--muted)}
.kbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.legend i{width:8px;height:8px;border-radius:2px;display:block}
.room{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--border)}
.room:first-child{border-top:0}
.room .rb{width:4px;align-self:stretch;border-radius:2px;flex:none}
.room .rn{font-weight:600;font-size:13.5px}
.room .rs{font-size:11.5px;color:var(--muted)}
.room .ra{text-align:right}
.room .ru{font-size:10.5px;color:var(--muted)}
.pn{display:flex;gap:10px;padding:0 16px 20px}
.pnBtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:14px}
.pnBtn[disabled]{opacity:0;pointer-events:none}
.pnBtn img{width:48px;height:38px;border-radius:8px;object-fit:cover;flex:none}
.pnBtn .pd{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.pnBtn .pm{min-width:0}
.pnBtn .pnm{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta{position:sticky;bottom:0;z-index:20;display:flex;gap:10px;padding:10px 16px max(env(safe-area-inset-bottom),12px);background:#fff;border-top:1px solid var(--border)}
.cta .btn{height:48px;gap:8px;flex:1;background:var(--accent);color:var(--accentInk)}
.cta .btn.soft{background:var(--soft);color:var(--ink)}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;max-width:90vw;background:var(--night);color:#fff;font-weight:500;font-size:12.5px;padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.3);text-align:center}
.round-btn{width:36px;height:36px}
.topActs{display:flex;align-items:center;gap:8px}
.present.soft{background:var(--soft);color:var(--ink);padding:0 14px 0 11px}
.pbtn.pri{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}

/* lightbox */
.lb{z-index:90;background:var(--night);display:flex;flex-direction:column}
.lb .lh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;color:#fff;font-weight:500;font-size:13px}
.lb .lh b{font-weight:600;color:var(--accent);margin-right:8px}
.lb .lh .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .lc{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none}
.lb .lbody{flex:1;position:relative;min-height:0}
.lb .lbody img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lb .arrow{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}

/* presentation */
.pres{z-index:80;background:var(--dark);color:#fff;overflow:hidden}
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:var(--dark);overflow:hidden}
.ptopbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:12px 14px;z-index:5;pointer-events:none}
.ptopbar>*{pointer-events:auto}
.ptopbar .pp{margin-left:auto;font-weight:600;font-size:12px;background:rgba(14,18,27,.55);padding:5px 12px;border-radius:999px}
.circle{width:40px;height:40px;border-radius:50%;background:rgba(14,18,27,.55);display:flex;align-items:center;justify-content:center;flex:none;transition:opacity .15s}
.circle[disabled]{opacity:.4;cursor:default}
.pnav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:8px 14px max(env(safe-area-inset-bottom),10px);z-index:5}
.ptrack{flex:1;height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.ptrack div{height:100%;background:var(--accent);transition:width .25s}
.pe{font-weight:600;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--accent)}
.ptitle{font-weight:700;font-size:26px;line-height:31px;margin:0}
.psub{font-size:13.5px;color:rgba(255,255,255,.85)}
.pstatus{align-self:flex-start;display:flex;align-items:center;gap:7px;margin-top:2px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:600;font-size:12.5px}
.pstatus .dot{width:8px;height:8px}
.pchips{display:flex;gap:8px;margin-top:8px}
.pchips>div{flex:1;min-width:0;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.08)}
.pchips .cl{font-weight:600;font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--accent)}
.pchips .cv{font-weight:600;font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fadeT,.fadeB{position:absolute;left:0;right:0;pointer-events:none}
.fadeT{top:0}.fadeB{bottom:0}
.cover-img{position:relative;overflow:hidden}
.cover-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-txt{display:flex;flex-direction:column;gap:6px;padding:0 20px;margin-top:-28px;position:relative}
.panelS{padding:64px 20px 64px;display:flex;flex-direction:column}
.h2{font-weight:700;font-size:24px;line-height:29px;margin:6px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{padding:12px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.tile .tl{font-weight:600;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.tile .tv{font-weight:700;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tv small{font-weight:500;font-size:12px;color:rgba(255,255,255,.65)}
.pdesc{margin:14px 0 0;font-size:13.5px;line-height:21px;color:rgba(255,255,255,.8)}
.pscroll{flex:1;min-height:0;overflow:auto;margin-top:12px;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
.pfloor{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--darkLine)}
.pfloor .tg{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.pfloor .fn{font-weight:600;font-size:15px}
.pfloor .fr{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:1px}
.pfloor .fa{font-weight:600;font-size:13px;white-space:nowrap}
.pspec{padding:12px 0;border-top:1px solid var(--darkLine);display:grid;gap:2px}
.pspec .k{font-weight:600;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.pspec .v{font-size:14.5px;line-height:21px}
.photoText{position:absolute;left:20px;right:20px;display:grid;gap:4px}
.photoT{font-weight:700;font-size:24px;line-height:29px}
.pcover{position:absolute;inset:0;padding:80px 22px 64px;display:flex;flex-direction:column;justify-content:space-between}
.hero46{font-weight:700;font-size:46px;line-height:50px;margin:10px 0}
.lead{font-size:14px;line-height:22px;color:rgba(255,255,255,.78);margin:0}
.statRow{display:flex;gap:8px}
.statRow>div{flex:1;min-width:0;padding:12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.statRow .sv3{font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statRow .sl3{font-weight:600;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-top:2px}
.pacts{display:flex;gap:10px;margin-top:12px}
.pbtn{flex:1;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06)}
.pend{position:absolute;inset:0;padding:80px 24px 64px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero34{font-weight:700;font-size:34px;line-height:39px;margin:0}
.again{align-self:center;padding:10px;font-weight:600;font-size:13px;color:rgba(255,255,255,.75)}
.cta2{margin-top:14px;height:52px;border-radius:14px;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:15px}
</style>
</head>

  return {...p, cat: p.cat || CAT_OF[p.type] || 'Residential', no: String(p.id).padStart(2,'0'), ts: +yr*12 + MON[mon], unitBeds};
});

/* ---------- logic (ported from src/lib/logic.ts) ---------- */
const ST = {1:{l:'Foundation',c:'#7C8597'},2:{l:'Structure',c:'#2563EB'},3:{l:'Finishing',c:'#E08A00'},4:{l:'Completed',c:'#16A34A'}};
const flNum = v => v === 'G' ? 0 : v === 'G+M' ? 0.5 : parseFloat(String(v).replace('G+','')) || 0;
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const place = p => [p.locality, p.city].filter(Boolean).join(', ');
const facingLine = p => p.facing ? `${p.facing}-facing` : '';
const plotText = p => p.plot ? fmt(p.plot) + ' sq ft' : '—';
const AREA = [
  {v:'a1',l:'Up to 1,200',min:0,max:1200},{v:'a2',l:'1,201–1,800',min:1201,max:1800},{v:'a3',l:'1,801–2,400',min:1801,max:2400},
  {v:'a4',l:'2,401–3,000',min:2401,max:3000},{v:'a5',l:'Above 3,000',min:3001,max:1e9}];
const KIND = {
  bed:{l:'Bedroom',c:'#1E2534'},key:{l:'Guest room / cottage',c:'#1E2534'},flat:{l:'Flat',c:'#1E2534'},bath:{l:'Bath',c:'#2563EB'},
  kitchen:{l:'Kitchen',c:'#E08A00'},living:{l:'Living',c:'#FFC000'},work:{l:'Commercial',c:'#8A6FBF'},util:{l:'Service / stair',c:'#C3C8D2'},outdoor:{l:'Open / parking',c:'#16A34A'}};
const DIMS = [
  {k:'cat',label:'Category',short:'Category',get:p=>p.cat},
  {k:'city',label:'City',short:'City',get:p=>p.city},
  {k:'type',label:'Project type',short:'Type',get:p=>p.tl},
  {k:'floors',label:'Floors',short:'Floors',get:p=>p.fl},
  {k:'area',label:'Plot area',short:'Area',get:p=>p.plot == null ? 'a5' : (AREA.find(a => p.plot >= a.min && p.plot <= a.max) || AREA[4]).v},
  {k:'status',label:'Status',short:'Status',get:p=>ST[p.stage].l},
  {k:'beds',label:'Bedrooms (per unit)',short:'Bedrooms',get:p=>String(Math.min(5,p.unitBeds))},
];
const PILL_ORDER = ['cat','city','type','floors','area','beds','status'];
const BEDS = [{v:'2',l:'2+ bed'},{v:'3',l:'3+ bed'},{v:'4',l:'4+ bed'},{v:'5',l:'5+ bed'}];
const SORTS = [{v:'new',l:'Newest first'},{v:'old',l:'Oldest first'},{v:'big',l:'Largest built-up'},{v:'small',l:'Smallest built-up'},{v:'tall',l:'Most floors'},{v:'no',l:'Project no.'}];
const EMPTY = () => ({cat:[],city:[],type:[],floors:[],area:[],status:[],beds:[]});
const dim = k => DIMS.find(d => d.k === k);

function match(p, f, q, except) {
  for (const d of DIMS) {
    if (d.k === except) continue;
    const sel = f[d.k];
    if (!sel.length) continue;
    if (d.k === 'beds') { if (p.unitBeds < +sel[0]) return false; }
    else if (!sel.includes(d.get(p))) return false;
  }
  const t = q.trim().toLowerCase();
  if (t) {
    const hay = [p.name,p.city,p.locality||'',p.tl,p.fl,p.cat,'p'+p.no,ST[p.stage].l].join(' ').toLowerCase();
    if (!t.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
const valuesCache = {};
function values(k) {
  if (valuesCache[k]) return valuesCache[k];
  let r;
  if (k === 'floors') r = [...new Set(PROJECTS.map(p => p.fl))].sort((a,b) => flNum(a)-flNum(b)).map(v => ({v, l: v==='G' ? 'G (single storey)' : v==='G+M' ? 'G + mezzanine' : v}));
  else if (k === 'cat') r = CATS.map(v => ({v, l: v}));
  else if (k === 'area') r = AREA.map(a => ({v: a.v, l: a.l + ' sq ft'}));
  else if (k === 'status') r = [4,3,2,1].map(i => ({v: ST[i].l, l: ST[i].l}));
  else if (k === 'beds') r = BEDS;
  else {
    const c = {}, d = dim(k);
    PROJECTS.forEach(p => { const v = d.get(p); c[v] = (c[v]||0) + 1; });
    r = Object.keys(c).sort((a,b) => c[b]-c[a]).map(v => ({v, l: v}));
  }
  return valuesCache[k] = r;
}
function optionCount(k, v, f, q) {
  const d = dim(k);
  return PROJECTS.filter(p => match(p, f, q, k) && (k === 'beds' ? p.unitBeds >= +v : d.get(p) === v)).length;
}
const chipLabel = (k, v) => k === 'area' ? AREA.find(a => a.v === v).l + ' sq ft' : k === 'beds' ? v + '+ bed' : v;
function summaryFor(f, k) {
  const sel = f[k];
  if (!sel.length) return null;
  return sel.length === 1 ? chipLabel(k, sel[0]) : sel.length + ' selected';
}
function sortProjects(list, s) {
  const fn = {
    new:(a,b)=>b.ts-a.ts, old:(a,b)=>a.ts-b.ts, big:(a,b)=>b.bua-a.bua, small:(a,b)=>a.bua-b.bua,
    tall:(a,b)=>b.nFloors-a.nFloors || b.bua-a.bua, no:(a,b)=>a.id-b.id}[s];
  return [...list].sort(fn);
}
function unitStat(p) {
  if (p.type === 'APARTMENTS') return {v:p.units, l:'Flats'};
  if (p.type === 'HOSPITALITY') return {v:p.units, l:'Guest rooms'};
  if (p.type === 'RESORT') return {v:p.units, l:'Cottages'};
  if (p.type === 'TOWNSHIP') return {v:p.units, l:'Villas'};
  if (p.type === 'HOSTEL') return {v:p.units, l:'Rooms'};
  if (['COMMERCIAL','INSTITUTIONAL','HEALTHCARE','INDUSTRIAL'].includes(p.type)) return {v:p.roomsCount, l:'Spaces'};
  return {v:p.beds, l:'Bedrooms'};
}
function roomMix(p) {
  const mix = [];
  const add = (n, l, k) => { if (n > 0) mix.push({n, l, c: KIND[k].c}); };
  const count = kind => p.floorsList.reduce((a,f) => a + f.rooms.filter(r => r.kind === kind).length, 0);
  if (['APARTMENTS','HOSPITALITY','RESORT','TOWNSHIP','HOSTEL'].includes(p.type)) add(p.units||0, p.unitLabel||'', 'flat');
  add(p.beds, p.beds === 1 ? 'Bedroom' : 'Bedrooms', 'bed');
  add(p.baths, p.baths === 1 ? 'Bathroom' : 'Bathrooms', 'bath');
  add(p.kitchens, p.kitchens === 1 ? 'Kitchen' : 'Kitchens', 'kitchen');
  add(count('living') * (p.type === 'TOWNSHIP' ? p.units || 1 : 1), 'Living spaces', 'living');
  add(count('work'), 'Work / public spaces', 'work');
  add(p.balconies, p.balconies === 1 ? 'Balcony' : 'Balconies', 'outdoor');
  add(p.parking, 'Car parking', 'outdoor');
  return mix;
}
function projectFacts(p) {
  const noCov = p.cov == null || !p.plot;
  const cov = p.cov || 70;

    {l:'Plot area',v:plotText(p),s:p.dims ? `${p.dims[0]} × ${p.dims[1]} ft` : p.plot ? 'Dimensions TBC' : 'Fit-out / campus project'},
    {l:'Built-up area',v:fmt(p.bua)+' sq ft',s:`${p.fl} · ${p.nFloors || p.floorsList.filter(f => f.area > 0).length} levels`},
    {l:'Carpet (est.)',v:fmt(p.carpet)+' sq ft',s:'~78% of built-up'},
    {l:'Ground coverage',v:noCov ? '—' : cov+'%',s:noCov ? 'Not applicable' : fmt(p.plot*cov/100)+' sq ft footprint'},
    {l:'Facing',v:p.facing || 'TBC',s:p.road ? `${p.road} ft road in front` : 'Road width TBC'},

    {l:'Start date',v:p.start || 'TBC',s:'Site mobilisation'},
    {l:'Duration',v:p.duration || 'TBC',s:'Estimated, end to end'},

}

        <div class="box" style="margin-top:12px">${F_.rooms.map(r => `<div class="room"><div class="rb" style="background:${KIND[r.kind].c}"></div><div style="flex:1;min-width:0"><div class="rn">${esc(r.name)}</div><div class="rs">${esc(r.sub ? r.sub : r.w && r.l ? `${KIND[r.kind].l} · ${r.w}′ × ${r.l}′` : KIND[r.kind].l)}</div></div><div class="ra"><div class="rn">${fmt(r.area || 0)}</div><div class="ru">sq ft</div></div></div>`).join('')}</div></div>

/* ---------- presentations ---------- */
let pres = null; // {kind:'project'|'portfolio', p?, list?, slides, idx}
function presClose() { pres = null; const el = $('#presLayer'); if (el) el.remove(); document.body.classList.remove('noscroll'); }
function presJump(n, smooth = true) {
  const c = Math.min(Math.max(n, 0), pres.slides.length - 1);
  const sc = $('#slidesEl');
  sc.scrollTo({left: c * sc.clientWidth, behavior: smooth ? 'smooth' : 'auto'});
  setPresIdx(c);
}
function setPresIdx(c) {
  pres.idx = c;
  const n = pres.slides.length;
  $('#ppos').textContent = `${c + 1} / ${n}`;
  $('#pbar').style.width = `${(c + 1) / n * 100}%`;
  $('#pprev').disabled = c === 0;
  $('#pnext').disabled = c === n - 1;
}
function openPres(state) {
  pres = {...state, idx: 0};
  document.body.classList.add('noscroll');
  let el = $('#presLayer');
  if (!el) { el = document.createElement('div'); el.id = 'presLayer'; el.className = 'layer pres'; document.body.appendChild(el); }
  renderPres();
}
function renderPres() {
  const el = $('#presLayer');
  const w = el.clientWidth || Math.min(innerWidth, 520), h = el.clientHeight || innerHeight;
  const padT = 64, padB = 64;
  const slides = pres.slides.map(s => pres.kind === 'project' ? projectSlide(pres.p, s, w, h, padT, padB) : portfolioSlide(pres.list, s, w, h, padT, padB)).join('');
  el.innerHTML = `<div class="slides" id="slidesEl">${slides}</div>
    <div class="ptopbar">${brand(true, 30)}<div class="pp" id="ppos"></div><button class="circle" data-act="presPdf" aria-label="Share PDF">${ic('share',18,'#fff')}</button><button class="circle" data-act="presClose" aria-label="Exit">${ic('close',18,'#fff')}</button></div>
    <div class="pnav"><button class="circle" id="pprev" data-act="presStep" data-d="-1" aria-label="Previous">${ic('left',20,'#fff')}</button><div class="ptrack"><div id="pbar"></div></div><button class="circle" id="pnext" data-act="presStep" data-d="1" aria-label="Next">${ic('right',20,'#fff')}</button></div>`;
  const sc = $('#slidesEl');
  sc.addEventListener('scroll', () => { const c = Math.round(sc.scrollLeft / sc.clientWidth); if (c !== pres.idx) setPresIdx(c); }, {passive: true});
  presJump(pres.idx, false);
}
const grad = (a, b, dir = 'to bottom') => `linear-gradient(${dir},${a},${b})`;
function coverBlock(p, w, h, tags, extra) {
  const ar = Math.min(Math.max(p.rw / p.rh, .75), 1.9);
  const imgH = Math.min(Math.max(w / ar, w * .8), h * .56);
  return `<div class="slide"><div class="cover-img" style="width:${w}px;height:${imgH}px"><img src="${img.render(p)}" alt="">
      <div class="fadeT" style="height:90px;background:${grad('rgba(14,18,27,.6)','rgba(14,18,27,0)')}"></div><div class="fadeB" style="height:90px;background:${grad('rgba(30,37,52,0)','#1E2534')}"></div></div>
    <div class="cover-txt">${tags}${extra || ''}</div></div>`;
}
function statusBlock(p) { return `<div class="pstatus"><span class="dot" style="background:${ST[p.stage].c}"></span>${esc(`${p.status} · ${p.pct}%`)}</div>`; }
function chipsBlock(a) { return `<div class="pchips">${a.map(x => `<div><div class="cl">${esc(x.l)}</div><div class="cv">${esc(x.v)}</div></div>`).join('')}</div>`; }
function projectSlide(p, s, w, h, padT, padB) {
  const u = unitStat(p);
  if (s.t === 'cover') {
    return coverBlock(p, w, h, `<div class="pe">Project ${p.no} · ${esc(p.tl)} · ${esc(p.fl)}</div><h2 class="ptitle">${esc(p.name)}</h2><div class="psub">${esc([place(p), facingLine(p)].filter(Boolean).join(' · '))}</div>${statusBlock(p)}`,
      chipsBlock([{l:'Plot',v:plotText(p)},{l:'Built-up',v:fmt(p.bua)+' sq ft'},{l:'Floors',v:p.fl}]));
  }
  if (s.t === 'photo') {
    return `<div class="slide"><img src="${img.site(p, s.i)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
      <div class="fadeT" style="height:${padT + 20}px;background:${grad('rgba(14,18,27,.55)','rgba(14,18,27,0)')}"></div>
      <div class="fadeB" style="height:${h * .45}px;background:${grad('rgba(14,18,27,0)','rgba(14,18,27,.92)')}"></div>
      <div class="photoText" style="bottom:${padB}px"><div class="pe">Site progress · ${String(s.i + 1).padStart(2,'0')} / ${String(p.site.length).padStart(2,'0')}</div><div class="photoT">${esc(p.site[s.i].c)}</div><div class="psub">${esc(`${p.name} · ${place(p)}`)}</div></div></div>`;
  }
  if (s.t === 'figures') {
    const figs = [{l:'Plot area',v:p.plot ? fmt(p.plot) : '—',u:p.plot ? 'sq ft' : ''},{l:'Built-up',v:fmt(p.bua),u:'sq ft'},{l:'Carpet (est.)',v:fmt(p.carpet),u:'sq ft'},{l:'Floors',v:p.fl,u:''},{l:u.l,v:String(u.v),u:''},{l:'Bathrooms',v:String(p.baths),u:''},{l:'Facing',v:p.facing || 'TBC',u:''},{l:'Duration',v:p.duration || 'TBC',u:''}];
    return `<div class="slide"><div class="panelS" style="height:100%;overflow:auto"><div class="pe">Key figures</div><h2 class="h2">${esc(p.name)}</h2>
      <div class="tiles">${figs.map(f => `<div class="tile"><div class="tl">${esc(f.l)}</div><div class="tv">${esc(f.v)}${f.u ? ` <small>${f.u}</small>` : ''}</div></div>`).join('')}</div><p class="pdesc">${esc(p.desc)}</p></div></div>`;
  }
  if (s.t === 'floors') {
    return `<div class="slide"><div class="panelS" style="height:100%"><div class="pe">Floor by floor</div><h2 class="h2">${esc(`${p.fl} · ${fmt(p.bua)} sq ft built-up`)}</h2>
      <div class="pscroll">${[...p.floorsList].reverse().map(f => `<div class="pfloor"><div class="tg">${esc(f.short)}</div><div style="flex:1;min-width:0"><div class="fn">${esc(f.name)}</div><div class="fr">${esc(f.rooms.filter(r => r.kind !== 'util').slice(0, 5).map(r => r.name).join(' · '))}</div></div><div class="fa">${f.area ? fmt(f.area) + ' sq ft' : 'Open'}</div></div>`).join('')}</div></div></div>`;
  }
  return `<div class="slide"><div class="panelS" style="height:100%"><div class="pe">Specifications</div><h2 class="h2">${esc(p.name)}</h2>
    <div class="pscroll">${p.specs.map(([l, v]) => `<div class="pspec"><div class="k">${esc(l)}</div><div class="v">${esc(v)}</div></div>`).join('')}</div></div></div>`;
}
function portfolioSlide(list, s, w, h, padT, padB) {
  const done = list.filter(p => p.stage === 4).length, bua = list.reduce((a,p) => a + p.bua, 0), cities = new Set(list.map(p => p.city)).size;
  if (s.t === 'cover') {

      <div class="pcover"><div><div class="pe">KONNBOT Construction Management</div><div class="hero46">Project<br>Portfolio</div><p class="lead">${list.length} projects across ${cities} ${cities === 1 ? 'city' : 'cities'}, from residences and villas to commercial and hospitality.</p></div>
      <div class="statRow">${stats.map(x => `<div><div class="sv3">${esc(x.v)}</div><div class="sl3">${x.l}</div></div>`).join('')}</div></div></div>`;

      chipsBlock([{l:'Plot',v:plotText(p)},{l:'Built-up',v:fmt(p.bua)+' sq ft'},{l:u.l,v:String(u.v)}]) +
      `<div class="pacts"><button class="pbtn" data-act="presDetail" data-id="${p.id}">View details${ic('right',16,'#fff')}</button><button class="pbtn pri" data-act="pdf" data-id="${p.id}">${ic('share',17,'#1A1200')}Share PDF</button></div>`);
  }
  return `<div class="slide"><div class="pend"><div class="pe">That is the portfolio</div><h2 class="hero34">Thank you</h2><p class="lead">${list.length} projects, ${done} completed and ${list.length - done} ongoing. Open any project from the list for floor plans, specifications and photos.</p>
    <button class="cta2" data-act="presPdf">${ic('share',18,'#1A1200')}${pres.kind === 'portfolio' ? 'Share portfolio PDF' : 'Share PDF'}</button>

function presentProject(p) {

  return `*{box-sizing:border-box;margin:0;padding:0}

  const done = list.filter(p => p.stage === 4).length, bua = list.reduce((a, p) => a + p.bua, 0), cities = new Set(list.map(p => p.city)).size;
  const pages = Math.ceil(Math.max(list.length - FIRST, 0) / PER_PAGE), total = 2 + pages;
  const logoChip = `<span style="display:flex;background:#fff;border-radius:6px;padding:5px 8px"><img src="${LOGO}" style="height:26px"></span>`;
  const cover = `<section class="page"><div class="sheet pf-cover"><img class="bgimg" src="${img.render(list[0])}"><div class="shade"></div>
    <div class="in"><div class="logo-chip" style="align-self:flex-start">${logoChip}</div>
      <div><div class="kicker">KONNBOT Construction Management</div><h1>Project<br>Portfolio</h1>
        <p class="sub">A selection of ${list.length} residential, commercial and hospitality projects across ${cities} ${cities === 1 ? 'city' : 'cities'}.</p><div class="pf-date">${esc(date)}</div></div>
      <div class="pf-stats"><div><b>${list.length}</b><i>Projects</i></div><div><b>${done}</b><i>Completed</i></div><div><b>${list.length - done}</b><i>Ongoing</i></div><div><b>${builtUpLabel(bua)}</b><i>Sq ft built</i></div></div>
    </div></div></section>`;
  const chrome = (n, body) => `<section class="page"><div class="sheet">
    <div class="head"><img src="${LOGO}" style="height:24px"><span>Project Portfolio</span></div><div class="body">${body}</div>
    <div class="foot"><span><b>KONNBOT</b> Construction Management</span><span>Page <b>${n}</b> of ${total}</span></div></div></section>`;
  const glance = `<div class="eyebrow">At a glance</div><h2>Portfolio summary</h2>
    <div class="sec" style="margin-top:6px"><div class="label">By city</div>${pfBars(pfTally(list, p => p.city))}</div>
    <div class="sec"><div class="label">By project type</div>${pfBars(pfTally(list, p => p.tl))}</div>
    <div class="sec"><div class="label">By status</div>${pfBars(pfTally(list, p => ST[p.stage].l))}</div>
    <div class="sec" style="margin-top:22px"><div class="label">Selected work</div></div>`;
  const rows = list.map(p => { const u = unitStat(p); return `<div class="pf-row"><div class="im"><img src="${img.thumb(p)}"></div><div class="tx">
      <div class="eyebrow">P${esc(p.no)} · ${esc(p.tl)} · ${esc(p.fl)}</div><div class="nm">${esc(p.name)}</div><div class="lc">${esc(place(p))}</div>
      <span class="pill"><i class="dot" style="background:${ST[p.stage].c}"></i>${esc(p.status)} · ${p.pct}%</span>
      <div class="mini"><div><b>${p.plot ? fmt(p.plot) : '—'}</b><i>Plot sq ft</i></div><div><b>${fmt(p.bua)}</b><i>Built-up</i></div><div><b>${esc(u.v)}</b><i>${esc(u.l)}</i></div></div></div></div>`; });
  const out = [cover, chrome(2, glance + rows.slice(0, FIRST).join(''))];
  for (let i = 0; i < pages; i++) { const from = FIRST + i * PER_PAGE; out.push(chrome(3 + i, rows.slice(from, from + PER_PAGE).join(''))); }
  return out.join('');
}
let pdfBusy = false;
let toastTimer;
function toast(msg, ms = 0) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => el.remove(), ms);
}
function pdfCleanup() { ['pdfHost', 'pdfPrintCss'].forEach(id => { const el = document.getElementById(id); if (el) el.remove(); }); }
/** Lays the document out in a hidden shadow root, waits for photos and fonts, then opens the print dialog ("Save as PDF"). */
async function printPdf(css, html, filename) {
  if (pdfBusy) return;
  pdfBusy = true;
  toast('Preparing PDF…');
  try {
    pdfCleanup();
    const host = document.createElement('div');
    host.id = 'pdfHost';
    host.attachShadow({mode: 'open'}).innerHTML = `<style>${css}</style>${html}`;
    const page = document.createElement('style');
    page.id = 'pdfPrintCss';
    page.textContent = '@page{size:A4;margin:0}@media screen{#pdfHost{display:none}}@media print{body>*:not(#pdfHost){display:none!important}html,body{background:#fff!important}}';
    document.head.appendChild(page);
    document.body.appendChild(host);
    await Promise.all([...host.shadowRoot.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
    await document.fonts.ready;
    const title = document.title;
    document.title = filename;  // browsers suggest this as the file name
    addEventListener('afterprint', () => { document.title = title; pdfCleanup(); }, {once: true});
    toast('In the print dialog choose “Save as PDF”', 5000);
    setTimeout(() => print(), 50);
  } catch (e) {
    toast('PDF failed – ' + (e && e.message || e), 5000);
  } finally {
    pdfBusy = false;
  }
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const sharePdf = p => printPdf(pdfCss, pdfBody(p), `KONNBOT-P${p.no}-${slug(p.name)}`);
const sharePortfolioPdf = list => list.length && printPdf(pfCss, portfolioPdfBody(list), `KONNBOT-Portfolio-${list.length}-projects`);

/* ---------- routing ---------- */
function route() {
  const m = location.hash.match(/^#\/project\/(\d+)/);
  const p = m && BY_ID.get(+m[1]);
  const home = $('#home'), det = $('#detail');
  if (p) {
    home.classList.add('hide'); det.classList.remove('hide');
    renderDetail(p);
    scrollTo(0, 0);
    document.title = `${p.name} · KONNBOT`;
  } else {
    const wasDetail = !det.classList.contains('hide');
    det.classList.add('hide'); home.classList.remove('hide');
    document.title = 'KONNBOT Project Portfolio';
    if (wasDetail) { cur = null; scrollTo(0, homeScroll); }
  }
}
let inApp = false;   // true once we pushed a history entry ourselves, so Back can safely use history.back()
function openProject(id) {
  if (!$('#detail').classList.contains('hide')) { location.replace(`#/project/${id}`); return; }  // prev/next: swap, don't stack
  homeScroll = scrollY;
  inApp = true;
  location.hash = `#/project/${id}`;
}

/* ---------- events ---------- */
const A = {
  open: d => openProject(d.id),
  back: () => { if (inApp) history.back(); else location.replace('#/'); },
  presentAll: () => presentPortfolio(S.results),
  pdf: d => sharePdf(BY_ID.get(+d.id)),
  pdfAll: () => sharePortfolioPdf(S.results),
  presPdf: () => pres.kind === 'project' ? sharePdf(pres.p) : sharePortfolioPdf(pres.list),
  presentOne: d => presentProject(BY_ID.get(+d.id)),
  clearQ: () => { S.q = ''; $('#q').value = ''; $('#qx').classList.add('hide'); compute(); refreshFilterUI(); },
  layout: d => { S.layout = d.v; persist(); updateList(); },
  sort: (d, el) => openSort(el),
  closeMenu: closeMenu,
  setSort: d => { S.sort = d.v; persist(); closeMenu(); compute(); updateList(); },
  openDD: (d, el) => { const r = el.getBoundingClientRect(); dd = {k: d.k, top: r.bottom + 6}; renderDD(); },
  closeDD: () => { dd = null; renderDD(); },
  clearDD: () => { clearDim(dd.k); refreshFilterUI(); },
  opt: d => { toggle(d.k, d.v); refreshFilterUI(); },
  openSheet: () => { sheetOpen = true; renderSheet(); },
  closeSheet: () => { sheetOpen = false; renderSheet(); },
  sheetBg: (d, el, e) => { if (e.target === el) A.closeSheet(); },
  acc: d => { sheetAcc[d.k] = !sheetAcc[d.k]; renderSheet(); },
  reset: () => { resetAll(); $('#q').value = ''; $('#qx').classList.add('hide'); refreshFilterUI(); },
  tab: d => { cur.tab = d.v; renderTab(); },
  floor: d => { cur.fi = +d.j; renderTab(); },
  heroStep: d => { const el = $('#heroS'), n = cur.gallery.length, t = (cur.hero + +d.d + n) % n; el.scrollTo({left: t * el.clientWidth, behavior: 'smooth'}); },
  lb: d => { lb = {list: cur.gallery, i: +d.i}; renderLb(); },
  lbStep: d => { lb.i = (lb.i + +d.d + lb.list.length) % lb.list.length; renderLb(); },
  lbClose: () => { lb = null; renderLb(); },
  presClose: presClose,
  presStep: d => presJump(pres.idx + +d.d),
  presStart: () => presJump(0),
  presDetail: d => { presClose(); openProject(d.id); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (lb) A.lbClose(); else if (pres) presClose(); else if (sheetOpen) A.closeSheet(); else if (dd) A.closeDD(); else if ($('#menuLayer')) closeMenu();
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const d = e.key === 'ArrowRight' ? 1 : -1;
    if (lb) A.lbStep({d}); else if (pres) presJump(pres.idx + d);
  }
});
let lastW = innerWidth;
addEventListener('resize', () => {   // ignore height-only changes (mobile URL bar) so open dropdowns survive
  if (innerWidth === lastW) return;
  lastW = innerWidth;
  if (pres) renderPres();
  if (dd) { dd = null; renderDD(); }
  closeMenu();
});
addEventListener('hashchange', route);

/* ---------- boot ---------- */
buildHome();
compute();
updateChrome();
updateList();
route();
window.__booted = true;
const splash = $('#splash');
setTimeout(() => { splash.classList.add('out'); setTimeout(() => splash.remove(), 480); }, 1700);
</script>
